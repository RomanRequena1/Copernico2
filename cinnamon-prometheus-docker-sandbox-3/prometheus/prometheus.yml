# Scrape configuration for default Cinnamon Prometheus HTTP Server on localhost
scrape_configs:
  - job_name: 'cinnamon'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9091'] #Seed 9091

  - job_name: kamon
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9095']  #Seed 9095

  - job_name: cassa
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9089']