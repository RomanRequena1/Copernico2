      default-dispatcher {
        executor = "fork-join-executor"
        fork-join-executor {
          parallelism-min = 4
          parallelism-factor = 3
          parallelism-max = 24
        }
        throughput = 20
        throughput-deadline-time = 200ms
      }
    }
  }


  my-dispatcher {
    type = "Dispatcher"
    executor = "thread-pool-executor"
    thread-pool-executor {
      core-pool-size-min = 8
      core-pool-size-max = 64
      max-pool-size-min = 100
      max-pool-size-max = 200
      task-queue-size = 10
    }
    #  throughput = 10
  }

  akka.streams {
      blocking-io-dispatcher {
        type = "Dispatcher"
        executor = "thread-pool-executor"
        thread-pool-executor {
          core-pool-size-min = 8
          core-pool-size-max = 64
          max-pool-size-min = 200
          max-pool-size-max = 400
          task-queue-size = 10
          keep-alive-time = 60s
        }
      }
  }

