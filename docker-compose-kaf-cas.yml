---
version: '3.3'

services:

  cassandra:
    container_name: cassandra
    image: cassandra:3.11.4
    ports:
      - 9042:9042
    environment:
      - "MAX_HEAP_SIZE=256M"
      - "HEAP_NEWSIZE=128M"
    networks:
      kafka_copernico_net:
        ipv4_address: 172.22.0.6

  kafka:
    container_name: kafka
    image: apache/kafka:3.7.1
    ports:
      - 9092:9092

    networks:
      kafka_copernico_net:
        ipv4_address: 172.22.0.5

networks:
  kafka_copernico_net:
    external:
      name: kafka_copernico_net
