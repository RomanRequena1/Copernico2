version: '3.3'

services:

  cassandra5:
    container_name: cassandra5
    image: cassandra:5.0.4
    ports:
      - 9042:9042
    environment:
      - "MAX_HEAP_SIZE=256M"
      - "HEAP_NEWSIZE=128M"
    networks:
      kafka_copernico_net:
        ipv4_address: 172.22.0.6

  # Zookeeper para Kafka principal
  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:7.6.0
    ports:
      - 2181:2181
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      kafka_copernico_net:
        ipv4_address: 172.22.1.3

  # Kafka principal (puerto 9092)
  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      kafka_copernico_net:
        ipv4_address: 172.22.1.5

  # Zookeeper para Kafka PSRM
  zookeeper2:
    container_name: zookeeper2
    image: confluentinc/cp-zookeeper:7.6.0
    ports:
      - 2182:2182
    environment:
      ZOOKEEPER_CLIENT_PORT: 2182
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      kafka_copernico_net:
        ipv4_address: 172.22.1.4

  # Kafka PSRM (puerto 9093)
  kafka2:
    container_name: kafka2
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper2
    ports:
      - 9093:9093
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper2:2182
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      kafka_copernico_net:
        ipv4_address: 172.22.1.6

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-principal
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_1_NAME: kafka-psrm
      KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS: kafka2:9093
      KAFKA_CLUSTERS_1_ZOOKEEPER: zookeeper2:2182
    depends_on:
      - kafka
      - kafka2
      - zookeeper
      - zookeeper2
    networks:
      kafka_copernico_net:
        ipv4_address: 172.22.1.7

networks:
  kafka_copernico_net:
    external:
      name: kafka_copernico_net
