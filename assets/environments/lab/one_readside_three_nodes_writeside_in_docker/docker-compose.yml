      KAFKA_DEBUG_MODE: 'OFF'
      REFLECTION_DEBUG_MODE: 'OFF'
      APACHE_KAFKA_DEBUG_MODE: 'OFF'
      APACHE_KAFKA_APP_INFO_PARSER_DEBUG_MODE: 'OFF'
      APACHE_KAFKA_CLIENTS_NETWORK_CLIENT_DEBUG_MODE: 'OFF'
