---
version: '3.3'

services:

  readside1:
    container_name: readside1
    image: 'readside/readside:1.0'
    ports:
      - '2554:2554'
      - '8554:8559'
      - '8084:8084'
      - '29095:9095'
      - '29091:9091'
      - '5266:5266'
    environment:
      SEED_NODES: 'akka://PersonClassificationServiceReadSide@172.22.4.3:2554'
      KAFKA_BROKERS_LIST: 'kafka:29092'
      STRING_CONEXION_TIMESCALEDB: 'jdbc:postgresql://172.22.2.1:5432/postgres'
      ENABLE_TRAZ: 'false'
      USER_POSTGRES: 'postgres'
      PASSWORD_POSTGRES: 'password'
      NAME_TABLE1: 'table_nifi_to_kafka'
      NAME_TABLE2: 'table_kafka_to_pcs'
      NAME_TABLE3: 'table_pcs_to_kafka'
      NAME_TABLE4: 'table_readsie_to_cass'
      CASSANDRA_CONTACT_POINTS: '172.22.0.6:9042'
      PROJECTIONIST_PARALELLISM: 3
      LOGSTASH: '172.22.5.3:5000'
      MAX_CONCURRENT_REQUESTS: "512"
      MAX_REQUESTS_PER_CONNECTION: "1024"
      POOL_LOCAL_SIZE: "3"
      POOL_REMOTE_SIZE: "1"
      CLUSTER_IP: 172.22.4.3
      CLUSTER_PORT: 2554
      HTTP_PORT: 8084
      PROMETHEUS_PORT: 9095
      CINNAMON_PORT: 9091
      ZIPKIN_HOST: host.docker.internal
      ZIPKIN_PORT: 9411
      JAEGER_HOST: host.docker.internal
      JAEGER_PORT: 5775
      #PASSIVATE: '20s'
      ENVIRONMENT_EXECUTION: 'DESA'
    networks:
      kafka_copernico_net:
        ipv4_address: 172.22.4.3


