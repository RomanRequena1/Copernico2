---
version: "3"

services:

  scylla-node1:
    container_name: cassandra
    image: scylladb/scylla
    restart: always
#    command: --seeds=scylla-node1 --smp 1 --memory 1.5G --overprovisioned 1 --api-address 172.22.0.6
    environment:
      - CASSANDRA_DC=DC1
      - CASSANDRA_SEEDS=scylla-node1
    volumes:
       - ./cassandra/config/cassandra.yaml:/etc/cassandra/cassandra.yaml
    networks:
      kafka_copernico_net:
        ipv4_address: 172.22.0.6

networks:
  kafka_copernico_net:
    external:
      name: kafka_copernico_net