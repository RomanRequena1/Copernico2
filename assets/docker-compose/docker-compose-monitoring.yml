---
version: '3.3'

services:

  grafana:
    build: './grafana'
    container_name: grafana
    network_mode: bridge
    ports:
      - 3000:3000

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    network_mode: bridge
    ports:
      - 9090:9090
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
